<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD de Artículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container mt-4">
    <a href="index.html"><button type="button" class="btn btn-sm btn-outline-secondary">Volver</button></a>
    <h1 class="text-center mb-4">Gestión de Artículos</h1>

    <form id="form-articulo" class="mb-4 border border-info border-2 p-3" style="border-radius: 16px;">
        <div class="mb-3">
            <h3>Crear/Editar articulo</h3>
        </div>
        <input type="hidden" id="idArticulo">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del Artículo</label>
            <input type="text" class="form-control" id="nombre" required placeholder="Indicar articulo">
        </div>
        <div class="mb-3">
            <label for="categorias" class="form-label">Categoria</label>
            <select type="text" class="form-control" id="categorias" required>
                 <option value="" disabled selected hidden>Elegir categoria...</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" class="form-control" id="precio" step="0.01" required placeholder="00000,00">
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <button type="button" class="btn btn-secondary" id="cancelar">Cancelar</button>
    </form>

        <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('http://localhost:8080/api/categorias') 
                .then(response => response.json())
                .then(data => {
                    const selectElement = document.getElementById('categorias');
                    data.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.id;
                        option.textContent = item.descripcion;
                        selectElement.appendChild(option);
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        });
    </script>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Categoria</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-articulos"></tbody>
    </table>
</div>

<script src="js/articulos.js"></script>
</body>
</html>
